name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  JWT_SECRET: ci_jwt_secret_123456789012345678901234567890
  IAM_V2_ENABLED: "1"
  IAM_PROVIDER: local
  IAM_TOKEN_HASH_SECRET: ci_hash_secret_123456789012345678901234567890
  IAM_ENCRYPTION_SECRET: ci_encrypt_secret_123456789012345678901234567890
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  INVENTORY_STORAGE_SIGNING_SECRET: ci_inventory_signing_secret_123456789012345678901234567890
  API_ALLOW_DEFAULT_ORG_FALLBACK: "0"

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npm run prisma:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

  integration-tests:
    name: Integration Tests (DB-backed)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: minierp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d minierp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/minierp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npm run prisma:generate

      - name: Apply migrations
        run: npm run prisma:migrate:deploy

      - name: Seed database
        run: npm run prisma:seed

      - name: Integration tests
        run: npm run test:integration

  migration-safety:
    name: Migration Safety
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: minierp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d minierp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/minierp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npm run prisma:generate

      - name: Apply migrations
        run: npm run prisma:migrate:deploy

      - name: Migration status
        run: npx prisma migrate status

      - name: Seed database
        run: npm run prisma:seed

      - name: IAM backfill idempotency
        run: npm run iam:backfill

  dependency-hygiene:
    name: Dependency Hygiene
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Outdated report
        run: npm run deps:outdated || true

      - name: Vulnerability scan
        run: npm run deps:audit

  e2e:
    name: E2E (Protected Branch)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: minierp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d minierp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/minierp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npm run prisma:generate

      - name: Apply migrations
        run: npm run prisma:migrate:deploy

      - name: Seed database
        run: npm run prisma:seed

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e
